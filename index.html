<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizCraft - AI Quiz Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Navigation Header -->
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">Q</div>
                <span class="logo-text">QuizCraft</span>
            </div>
            <div class="nav-buttons">
                <a href="login.html" class="btn-ghost">Log In</a>
                <a href="signup.html" class="btn-primary">Sign Up</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-grid">
                <!-- Left Content -->
                <div class="hero-text">
                    <h1 class="main-heading">
                        Ultimate Quiz <br>
                        Experience
                    </h1>
                    <p class="subtitle">
                        Traditional and AI quizzes in one place.
                    </p>
                    <div class="cta-buttons">
                        <!-- ✅ Link to your Streamlit app -->
                        <a href="signup.html" class="btn-cta" target="_blank">Get Started</a>
                        <button class="btn-outline">Learn More</button>
                    </div>
                </div>

                <!-- Right Illustration -->
                <div class="illustration">
                    <div class="ai-circle">
                        <div class="ai-inner">
                            <div class="book-icon"></div>
                        </div>
                    </div>
                    <div class="puzzle-container">
                        <div class="puzzle-piece puzzle-blue"></div>
                        <div class="puzzle-piece puzzle-orange"></div>
                        <div class="puzzle-piece puzzle-yellow"></div>
                    </div>
                    <div class="floating-card"></div>
                    <div class="floating-circle"></div>
                    <div class="floating-square"></div>
                    <div class="person person-1"></div>
                    <div class="person person-2"></div>
                </div>
            </div>
        </main>

        <div class="bg-element bg-element-1"></div>
        <div class="bg-element bg-element-2"></div>
    </div>
</body>
</html>
