<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizCraft – Reset Password</title>
  <link rel="stylesheet" href="passs.css">
</head>
<body>
  <div class="container">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon">Q</div>
        <span class="logo-text">QuizCraft</span>
      </div>
      <a href="index.html" class="btn-ghost">Back</a>
    </nav>

    <!-- Password Reset Section -->
    <main class="reset-section">
      <div class="reset-card slide-up">
        <h1 class="reset-heading">Reset Your Password</h1>
        <p class="reset-subtitle">Enter a new password to secure your account.</p>

        <form class="reset-form">
          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="Enter new password" required>
          </div>

          <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="Re-enter new password" required>
          </div>

          <button type="submit" class="btn-cta full-width">Update Password</button>
        </form>
      </div>
    </main>

    <!-- Background elements -->
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>
  </div>
</body>
</html>
