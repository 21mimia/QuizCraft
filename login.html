<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuizCraft</title>
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <!-- Navigation Header -->
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">Q</div>
                <span class="logo-text">QuizCraft</span>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn-ghost">Back to Home</a>
            </div>
        </nav>

        <!-- Login Form -->
        <div class="auth-content">
            <div class="auth-form-container">
                <div class="auth-form">
                    <div class="form-header">
                        <h1>Welcome Back</h1>
                        <p>Sign in to your QuizCraft account</p>
                    </div>

                    <form class="login-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" id="remember">
                                <span class="checkmark"></span>
                                Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-submit">Sign In</button>
                    </form>

                    <div class="form-footer">
                        <p>Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
                    </div>


                    
                </div>
            </div>

            <!-- Decorative Elements -->
            <div class="auth-decoration">
                <div class="floating-shape shape-1"></div>
                <div class="floating-shape shape-2"></div>
                <div class="floating-shape shape-3"></div>
                <div class="quiz-icon-large">
                    <div class="quiz-inner">?</div>
                </div>
            </div>
        </div>

        <!-- Background Elements -->
        <div class="bg-element bg-element-1"></div>
        <div class="bg-element bg-element-2"></div>
    </div>
</body>
</html>
