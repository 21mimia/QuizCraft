<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - QuizCraft</title>
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <!-- Navigation Header -->
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">Q</div>
                <span class="logo-text">QuizCraft</span>
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn-ghost">Back to Home</a>
            </div>
        </nav>

        <!-- Signup Form -->
        <div class="auth-content">
            <div class="auth-form-container">
                <div class="auth-form">
                    <div class="form-header">
                        <h1>Create Account</h1>
                        <p>Join QuizCraft and start learning with AI</p>
                    </div>

                    <form class="signup-form" method="POST" action="/signup">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" placeholder="First name" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" id="terms" required>
                                <span class="checkmark"></span>
                                I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                            </label>
                        </div>

                        <button type="submit" class="btn-submit">Create Account</button>
                    </form>

                    <div class="form-footer">
                        <p>Already have an account? <a href="login.html" class="auth-link">Sign in</a></p>
                    </div>
                </div>
            </div>

            <!-- Decorative Elements -->
            <div class="auth-decoration">
                <div class="floating-shape shape-1"></div>
                <div class="floating-shape shape-2"></div>
                <div class="floating-shape shape-3"></div>
                <div class="quiz-icon-large">
                    <div class="quiz-inner">AI</div>
                </div>
            </div>
        </div>

        <!-- Background Elements -->
        <div class="bg-element bg-element-1"></div>
        <div class="bg-element bg-element-2"></div>
    </div>
</body>
</html>
